[project]
name = "bluecore-airflow-common"
version = "0.1.0"
description = "Shared helpers, base templates and styles for Blue Core Airflow plugins"
readme = "README.md"
authors = [
    { name = "Jeremy Nelson", email = "jpnelson@stanford.edu" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
     "apache-airflow>=3.2,<4"
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pytest>=8.3.4",
    "ruff>=0.9.7",
]