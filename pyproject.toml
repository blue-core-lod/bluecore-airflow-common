[project]
name = "bluecore-airflow-common"
version = "0.1.0"
description = "Shared helpers, base templates and styles for Blue Core Airflow plugins"
readme = "README.md"
authors = [
    { name = "Jeremy Nelson", email = "jpnelson@stanford.edu" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
     "apache-airflow>=3.2,<4",
     "apache-airflow-client>=3.2,<3.4",
     "bluecore-client>=0.3",
     "httpx>=0.28,<1",
     "pydantic>=2.7,<3",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "respx>=0.23.1",
    "ruff>=0.9.7",
    "ty>=0.0.96",
]

[tool.ty.src]
include = ["src", "tests"]
