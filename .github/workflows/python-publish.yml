# Upload bluecore-airflow-common to PyPI when a GitHub release is published.
# Publishing uses PyPI trusted publishing, so PyPI needs a trusted publisher for
# this repo, this workflow file (python-publish.yml) and the "pypi" environment.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check the release tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(uv version --short)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Run tests
        run: uv run pytest

      - name: Build release distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Add required reviewers to this environment in the repo settings to gate
    # each upload on an approval.
    environment:
      name: pypi
      url: https://pypi.org/p/bluecore-airflow-common

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
